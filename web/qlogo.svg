<svg width="384" height="384" viewBox="0 0 384 384" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diskGrad" x1="0" y1="0" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#0086b3"/>
      <stop offset="100%" stop-color="#0a3d91"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="glowRing">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowDisk">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStar">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Disque rotatif avec fond dégradé -->
  <g transform="translate(192,192)">
    <circle cx="0" cy="0" r="180" fill="url(#diskGrad)" filter="url(#glowDisk)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="0" cy="0" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="280 800" filter="url(#glowRing)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="60 900" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Logo q centré dans le disque, en blanc -->
  <g transform="translate(64, 320) scale(1, -1)" filter="url(#shadow)">
    <path d="M169.9 50.2C169.5 174.8 169.7 166.9 167.2 173.9C161 191.1 147.9 201.4 130.8 202.7C114.1 204 97.5 193.4 89.8 176.3C87.9 172.3 87.6 169.6 87.5 160.5C87.5 149.7 87.6 149.2 91.3 141.8C96.1 132 104.1 124.4 113.4 120.6C125.3 115.9 140.9 117.5 151 124.5C153 125.9 154.9 127 155.3 127C155.7 127 156 119.1 156 109.4V91.9L151.7 90C143.3 86.3 134.2 84.7 124 85.3C96.6 86.9 72.3 103.1 61 127.4C55.9 138.2 54 146.7 54 159.3C54 172.3 56.1 181.3 62.2 194C66.6 203.1 68.4 205.5 75.9 213C90.4 227.3 106.7 234.2 126.5 234.3C141.4 234.3 152.6 230.8 164.3 222.3C168.3 219.3 169 219.1 169.1 220.7C169.3 227 169.7 232.1 170.1 232.4C170.3 232.6 177.6 232.5 186.3 232.3L202 231.7V137.5V120.25V108V93.2C202.3 85.1 202.3 65.8 202.1 50.2L201.8 22H170L169.9 50.2ZM84.2 113.4C71.4 126.9 65.3 142.4 63.3 166.8C62.8 172.2 63.5 176.9 65.6 183.6C65.9 184.7 65.5 184.5 64.6 183C63.8 181.6 61.6 176.1 59.9 170.7C57 161.8 56.8 160 57.3 152.7C57.9 143.9 60.5 135.2 64.4 128.5C67.1 124 71.3 119.6 69.2 123.6C67.4 127 64 136 64.5 136C64.8 136 66.3 133.3 68 130.1C72 122 85.3 108 88.9 108C89.1 108 87 110.4 84.2 113.4ZM103.9 115.7C101 118.4 97.5 121.6 96.2 123C92.4 126.8 86.6 136.4 87.7 136.7C88.3 136.9 87.8 139.4 86.4 142.8C81.1 155.9 80.7 169 85.4 181.5C87.4 186.6 87.6 188.1 86.5 186.9C83.8 184.2 79.9 171.9 79.3 164.5C78.7 155.8 78 153.6 77 157C75.4 162 75.9 151.7 77.5 145.5C81 132.3 91.2 119 101.9 113.7C109.6 109.9 110 110.3 103.9 115.7Z" fill="#FFFFFF"/>
  </g>

  <!-- Étoile avec mouvement naturel : respiration + légère rotation -->
  <g transform="translate(64, 320) scale(1, -1)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1.5,-1.5; 0,0; -1.5,1.5; 0,0" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <g filter="url(#glowStar)">
        <path d="M55 5 C59 33, 74 48, 102 52 C74 56, 59 71, 55 99 C51 71, 36 56, 8 52 C36 48, 51 33, 55 5 Z" fill="#FFFFFF">
          <!-- Respiration : scale doux et continu -->
          <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" additive="sum"/>
          <!-- Légère rotation naturelle -->
          <animateTransform attributeName="transform" type="rotate" values="0 55 52; 4 55 52; 0 55 52; -4 55 52; 0 55 52" dur="4s" repeatCount="indefinite" additive="sum"/>
          <!-- Opacité douce -->
          <animate attributeName="opacity" values="0.75;1;0.75" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
        </path>
      </g>
    </g>
  </g>
</svg>