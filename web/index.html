<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrafftInk — tableau local</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }
        
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #loading {
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 18px;
            text-align: center;
        }
        
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
            overscroll-behavior: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="spinner"></div>
            <div id="loading-text">Chargement de DrafftInk...</div>
            <div id="loading-progress" style="font-size: 14px; color: #888; margin-top: 8px;"></div>
        </div>
    </div>
    
    <script>
        // Prevent the browser from stealing shortcuts used by the whiteboard.
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (
                e.key === 'e' || e.key === 'E' ||
                e.key === 's' || e.key === 'S' ||
                e.key === 'g' || e.key === 'G' ||
                ['p', 'b', 'i', 'u'].includes(e.key.toLowerCase())
            )) {
                e.preventDefault();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F11' && !e.repeat) {
                e.preventDefault();
                const task = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
                task.catch(err => console.warn('Fullscreen unavailable', err));
            }
        });

        // Chrome/Edge expose precision-touchpad pinch as Ctrl+wheel. Prevent
        // browser page zoom so DrafftInk receives the gesture instead.
        window.__drafftinkPinchGesture = null;
        window.addEventListener('wheel', function(e) {
            if (e.ctrlKey || e.metaKey) {
                // Chrome/Edge represent a precision-touchpad pinch as Ctrl+wheel.
                // Preserve the real DOM modifier + focal point because winit's
                // generic MouseWheel event does not expose wheel modifiers.
                window.__drafftinkPinchGesture = {
                    factor: Math.max(0.80, Math.min(1.25, Math.exp(-e.deltaY * 0.0025))),
                    x: e.clientX,
                    y: e.clientY
                };
                e.preventDefault();
            }
        }, { passive: false });

        // Sparse repaint scheduling: caret, fading laser, autosave and async work
        // wake the Rust window only when needed. Pointer/pinch events still draw immediately.
        let repaintTimer = null, repaintDeadline = Infinity;
        window.drafftinkRequestRepaint = function(delay) {
            delay = Math.max(0, Math.min(2147483647, Number(delay) || 0));
            const deadline = performance.now() + delay;
            if (deadline >= repaintDeadline) return;
            if (repaintTimer !== null) clearTimeout(repaintTimer);
            repaintDeadline = deadline;
            repaintTimer = setTimeout(() => {
                repaintTimer = null; repaintDeadline = Infinity;
                window.dispatchEvent(new Event('drafftink-redraw'));
            }, delay);
        };

        // Immutable font bytes are cached in this browser on this computer only.
        function fontCache(operation, value) {
            return new Promise((resolve, reject) => {
                const open = indexedDB.open('drafftink.local_fonts.v1', 1);
                open.onupgradeneeded = () => open.result.createObjectStore('fonts', {keyPath:'postscriptName'});
                open.onerror = () => reject(open.error);
                open.onsuccess = () => {
                    const db=open.result;
                    const tx=db.transaction('fonts',operation==='get'?'readonly':'readwrite');
                    const request=tx.objectStore('fonts')[operation](value);
                    request.onsuccess=()=>resolve(request.result);
                    request.onerror=()=>reject(request.error);
                    tx.oncomplete=()=>db.close(); tx.onabort=()=>db.close();
                };
            });
        }
        window.drafftinkQueryLocalFonts = async function() {
            try {
                const response=await fetch('/local-fonts.json');
                if(response.ok) { const fonts=await response.json(); if(Array.isArray(fonts)) return fonts; }
            } catch(_) {}
            if (!window.queryLocalFonts) return [];
            try {
                const fonts=await window.queryLocalFonts();
                return fonts.map(font=>({family:font.family||'',fullName:font.fullName||'',postscriptName:font.postscriptName||'',style:font.style||''}));
            } catch(error) { console.warn('Unable to enumerate local fonts:',error); return []; }
        };
        window.drafftinkReadLocalFont = async function(postscriptName, allowPrompt=true) {
            const cached=await fontCache('get',postscriptName).catch(()=>undefined);
            if(cached) return cached;
            try {
                const response=await fetch('/local-font/'+encodeURIComponent(postscriptName));
                if(response.ok) {
                    const result={family:'',postscriptName,bytes:new Uint8Array(await response.arrayBuffer())};
                    await fontCache('put',result).catch(()=>{}); return result;
                }
            } catch(_) {}

            if(!window.queryLocalFonts) throw new Error('Local Font Access API unavailable');
            if(!allowPrompt) {
                const access=await navigator.permissions.query({name:'local-fonts'}).catch(()=>null);
                if(!access || access.state!=='granted') throw new Error('Activate local fonts in Settings first');
            }
            let fonts;
            try { fonts=await window.queryLocalFonts({postscriptNames:[postscriptName]}); }
            catch(_) { if(!allowPrompt) throw _; fonts=await window.queryLocalFonts(); }
            const font=fonts.find(font=>font.postscriptName===postscriptName);
            if(!font) throw new Error('Font not found: '+postscriptName);
            const bytes=new Uint8Array(await (await font.blob()).arrayBuffer());
            const result={family:font.family||'',postscriptName:font.postscriptName,bytes};
            await fontCache('put',result).catch(error=>console.warn('Font cache unavailable:',error));
            return result;
        };

        const cursorTemplates=Promise.all(['cursormouse.svg','cursortext.svg'].map(name=>fetch(name).then(r=>{
            if(!r.ok) throw new Error('Cursor unavailable'); return r.text();
        })));
        let cursorSVG=null, cursorCanvas=null, cursorObserver=null;
        let textCursor=false, cursorOutline='#000000', cursorValue='';
        function applyCursor() {
            if(!cursorSVG || !cursorCanvas) return;
            const native=cursorCanvas.style.cursor;
            if(/resize|grab|move|pointer|none/.test(native) && !native.startsWith('url(')) return;
            if(cursorCanvas.style.cursor!==cursorValue) cursorCanvas.style.cursor=cursorValue;
        }
        window.drafftinkSetCursor=function(text,color) {
            const canvas=document.querySelector('canvas');
            if(canvas!==cursorCanvas) {
                cursorObserver?.disconnect(); cursorCanvas=canvas;
                if(canvas) {
                    cursorObserver=new MutationObserver(applyCursor);
                    cursorObserver.observe(canvas,{attributes:true,attributeFilter:['style']});
                }
            }
            const changed=textCursor!==text || cursorOutline!==color || !cursorValue;
            textCursor=text; cursorOutline=/^#[0-9a-f]{6}$/i.test(color)?color:'#000000';
            if(cursorSVG && changed) {
                const svg=textCursor?cursorSVG[1]:cursorSVG[0].replaceAll('currentColor',cursorOutline);
                cursorValue=`url("data:image/svg+xml,${encodeURIComponent(svg)}") ${textCursor?'14 14, text':'6 5, default'}`;
            }
            applyCursor();
        };
        cursorTemplates.then(svg=>{cursorSVG=svg;cursorValue='';window.drafftinkSetCursor(textCursor,cursorOutline);})
            .catch(error=>console.warn('Custom cursors unavailable:',error));

        // Persistent export folder using the File System Access API (Chrome/Edge).
        // Directory handles are structured-cloneable and are kept in IndexedDB.
        const DRAFFTINK_FS_DB = 'drafftink-file-handles';
        const DRAFFTINK_FS_STORE = 'handles';

        function openDrafftInkFsDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DRAFFTINK_FS_DB, 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(DRAFFTINK_FS_STORE)) {
                        db.createObjectStore(DRAFFTINK_FS_STORE);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function putExportDirectoryHandle(handle) {
            const db = await openDrafftInkFsDb();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(DRAFFTINK_FS_STORE, 'readwrite');
                tx.objectStore(DRAFFTINK_FS_STORE).put(handle, 'exportDirectory');
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
            db.close();
        }

        async function getExportDirectoryHandle() {
            const db = await openDrafftInkFsDb();
            const value = await new Promise((resolve, reject) => {
                const tx = db.transaction(DRAFFTINK_FS_STORE, 'readonly');
                const req = tx.objectStore(DRAFFTINK_FS_STORE).get('exportDirectory');
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
            db.close();
            return value;
        }

        async function ensureReadWritePermission(handle) {
            if (!handle) return false;
            const options = { mode: 'readwrite' };
            if ((await handle.queryPermission(options)) === 'granted') return true;
            return (await handle.requestPermission(options)) === 'granted';
        }

        window.drafftinkPickExportDirectory = async function() {
            if (!window.showDirectoryPicker) return '';
            const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
            if (!(await ensureReadWritePermission(handle))) return '';
            await putExportDirectoryHandle(handle);
            return handle.name || 'Dossier sélectionné';
        };

        window.drafftinkSaveBlobToExportDirectory = async function(filename, blob) {
            try {
                const handle = await getExportDirectoryHandle();
                if (!handle || !(await ensureReadWritePermission(handle))) return false;
                const fileHandle = await handle.getFileHandle(filename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
                return true;
            } catch (error) {
                console.warn('DrafftInk export folder unavailable:', error);
                return false;
            }
        };

        // The app uses WebGPU. Give a clear message before fetching the WASM
        // rather than failing later with an opaque renderer error.
        window.__drafftinkWebGpuAvailable = !!navigator.gpu;
    </script>
    <script type="module">
        import init from './pkg/drafftink_app.js';
        
        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        async function run() {
            const loadingText = document.getElementById('loading-text');
            const loadingProgress = document.getElementById('loading-progress');

            if (!window.__drafftinkWebGpuAvailable) {
                loadingText.textContent = 'WebGPU indisponible';
                loadingProgress.innerHTML = 'Utilisez une version récente de Chrome ou Edge, avec l’accélération matérielle activée.';
                return;
            }
            
            try {
                // Stream directly into WebAssembly instead of holding chunks plus a second copy.
                const response = await fetch('./pkg/drafftink_app_bg.wasm');
                if (!response.ok) throw new Error(`Chargement impossible (${response.status})`);
                loadingText.textContent = 'Initialisation...';
                loadingProgress.textContent = '';
                const wasm = await init({ module_or_path: response });
                window.drafftinkMemoryUsage = () => ({
                    wasm_bytes: wasm.memory.buffer.byteLength,
                    javascript_used_bytes: performance.memory?.usedJSHeapSize ?? null,
                    javascript_total_bytes: performance.memory?.totalJSHeapSize ?? null,
                    // Browser/GPU/shared-process memory cannot be inferred from these values.
                });

                // Remove loading indicator
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.remove();
                }
            } catch (error) {
                console.error('Failed to load DrafftInk:', error);
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.innerHTML = `
                        <div style="color: #ef4444;">Impossible de charger DrafftInk</div>
                        <div style="font-size: 14px; margin-top: 8px; color: #888;">
                            ${error.message || 'Unknown error'}
                        </div>
                        <div style="font-size: 12px; margin-top: 16px; color: #666;">
                            Vérifiez que WebGPU est disponible dans ce navigateur (Chrome ou Edge récent recommandé).
                        </div>
                    `;
                }
            }
        }
        
        run();
    </script>
</body>
</html>
