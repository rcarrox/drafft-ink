<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrafftInk — tableau local</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }
        
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #loading {
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 18px;
            text-align: center;
        }
        
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
            overscroll-behavior: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="spinner"></div>
            <div id="loading-text">Chargement de DrafftInk...</div>
            <div id="loading-progress" style="font-size: 14px; color: #888; margin-top: 8px;"></div>
        </div>
    </div>
    
    <script>
        // Prevent the browser from stealing shortcuts used by the whiteboard.
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (
                e.key === 'e' || e.key === 'E' ||
                e.key === 's' || e.key === 'S' ||
                e.key === 'g' || e.key === 'G'
            )) {
                e.preventDefault();
            }
        });

        // Chrome/Edge expose precision-touchpad pinch as Ctrl+wheel. Prevent
        // browser page zoom so DrafftInk receives the gesture instead.
        window.addEventListener('wheel', function(e) {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
            }
        }, { passive: false });

        // Persistent export folder using the File System Access API (Chrome/Edge).
        // Directory handles are structured-cloneable and are kept in IndexedDB.
        const DRAFFTINK_FS_DB = 'drafftink-file-handles';
        const DRAFFTINK_FS_STORE = 'handles';

        function openDrafftInkFsDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DRAFFTINK_FS_DB, 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(DRAFFTINK_FS_STORE)) {
                        db.createObjectStore(DRAFFTINK_FS_STORE);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function putExportDirectoryHandle(handle) {
            const db = await openDrafftInkFsDb();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(DRAFFTINK_FS_STORE, 'readwrite');
                tx.objectStore(DRAFFTINK_FS_STORE).put(handle, 'exportDirectory');
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
            db.close();
        }

        async function getExportDirectoryHandle() {
            const db = await openDrafftInkFsDb();
            const value = await new Promise((resolve, reject) => {
                const tx = db.transaction(DRAFFTINK_FS_STORE, 'readonly');
                const req = tx.objectStore(DRAFFTINK_FS_STORE).get('exportDirectory');
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
            db.close();
            return value;
        }

        async function ensureReadWritePermission(handle) {
            if (!handle) return false;
            const options = { mode: 'readwrite' };
            if ((await handle.queryPermission(options)) === 'granted') return true;
            return (await handle.requestPermission(options)) === 'granted';
        }

        window.drafftinkPickExportDirectory = async function() {
            if (!window.showDirectoryPicker) return '';
            const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
            if (!(await ensureReadWritePermission(handle))) return '';
            await putExportDirectoryHandle(handle);
            return handle.name || 'Dossier sélectionné';
        };

        window.drafftinkSaveBlobToExportDirectory = async function(filename, blob) {
            try {
                const handle = await getExportDirectoryHandle();
                if (!handle || !(await ensureReadWritePermission(handle))) return false;
                const fileHandle = await handle.getFileHandle(filename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
                return true;
            } catch (error) {
                console.warn('DrafftInk export folder unavailable:', error);
                return false;
            }
        };

        // The app uses WebGPU. Give a clear message before fetching the WASM
        // rather than failing later with an opaque renderer error.
        window.__drafftinkWebGpuAvailable = !!navigator.gpu;
    </script>
    <script type="module">
        import init from './pkg/drafftink_app.js';
        
        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        async function run() {
            const loadingText = document.getElementById('loading-text');
            const loadingProgress = document.getElementById('loading-progress');

            if (!window.__drafftinkWebGpuAvailable) {
                loadingText.textContent = 'WebGPU indisponible';
                loadingProgress.innerHTML = 'Utilisez une version récente de Chrome ou Edge, avec l’accélération matérielle activée.';
                return;
            }
            
            try {
                // Fetch WASM with progress
                const wasmPath = './pkg/drafftink_app_bg.wasm';
                const response = await fetch(wasmPath);
                const contentLength = response.headers.get('Content-Length');
                const total = parseInt(contentLength, 10) || 0;
                
                let loaded = 0;
                const reader = response.body.getReader();
                const chunks = [];
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;
                    
                    if (total > 0) {
                        const percent = Math.min(100, Math.round((loaded / total) * 100));
                        loadingProgress.textContent = `${percent}%`;
                    } else {
                        loadingProgress.textContent = formatBytes(loaded);
                    }
                }
                
                // Combine chunks into single array
                const wasmBytes = new Uint8Array(loaded);
                let offset = 0;
                for (const chunk of chunks) {
                    wasmBytes.set(chunk, offset);
                    offset += chunk.length;
                }
                
                loadingText.textContent = 'Initialisation...';
                loadingProgress.textContent = '';
                
                // Initialize with the fetched WASM bytes
                await init(wasmBytes);
                
                // Remove loading indicator
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.remove();
                }
            } catch (error) {
                console.error('Failed to load DrafftInk:', error);
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.innerHTML = `
                        <div style="color: #ef4444;">Impossible de charger DrafftInk</div>
                        <div style="font-size: 14px; margin-top: 8px; color: #888;">
                            ${error.message || 'Unknown error'}
                        </div>
                        <div style="font-size: 12px; margin-top: 16px; color: #666;">
                            Vérifiez que WebGPU est disponible dans ce navigateur (Chrome ou Edge récent recommandé).
                        </div>
                    `;
                }
            }
        }
        
        run();
    </script>
</body>
</html>
