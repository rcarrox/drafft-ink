[package]
name = "drafftink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core data structures and logic for DrafftInk whiteboard"

[dependencies]
kurbo.workspace = true
peniko.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
winit.workspace = true
winit_input_helper = "0.17"
log = "0.4"
base64 = "0.22"
pathfinding = "4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Removing the collaboration stack also removed a transitive feature that
# enabled JavaScript entropy for getrandom 0.2. Enable it explicitly for
# wasm32-unknown-unknown so UUID/random users continue to compile in browsers.
getrandom = { version = "0.2", features = ["js"] }
web-sys = { workspace = true, features = [
    "Window",
    "Storage",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "DomStringList",
    "Event",
    "EventTarget",
] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-time.workspace = true
rexie = "0.6"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
tempfile = "3"
